name: Bangumi Date Processing

on:
  workflow_dispatch:
  schedule:
    - cron: '10 21 * * 2'

jobs:
  Bangumi_Date_Processing:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          cache: true

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run program
        run: ./build/BangumiDateProcessing

      - name: Copy SQL file
        run: cp build/bangumi_data.sql .

      - name: Commit and push SQL file to repository root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bangumi_data.sql
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update bangumi_data.sql [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
          fi
